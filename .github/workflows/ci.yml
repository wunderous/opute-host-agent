name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make rust-check

  spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make spec-validate

  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The Go standard library is part of the observable contract: install
      # exactly the toolchain baseline/source-lock.json pins (Makefile exports
      # it as GOTOOLCHAIN, so a different local Go is never used to build).
      - name: Read pinned Go toolchain
        id: lock
        run: python3 -c 'import json; print("go=" + json.load(open("baseline/source-lock.json"))["goToolchain"].removeprefix("go"))' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.lock.outputs.go }}
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Host facts the host-read and resource-admission scenarios observe,
      # recorded so a runner-only diff can be told apart from a parity one.
      - name: Record runner environment
        run: tools/parity/runner-env.sh > runner-env.txt 2>&1
      - name: Verify committed evidence and re-prove M1 parity
        run: make parity-ci
      # .parity is a dot directory: upload-artifact skips it unless hidden
      # files are included.
      - name: Upload parity diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-ci-evidence
          path: |
            .parity/ci-*
            runner-env.txt
          include-hidden-files: true
          if-no-files-found: warn
