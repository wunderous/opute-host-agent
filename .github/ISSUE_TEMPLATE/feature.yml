name: Feature request
description: A tool, recipe, provider or platform you need.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task you want your assistant to carry out on the host, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: For example a new typed tool, a recipe, or a provider plugin. Changes to the MCP contract go through an OpenSpec change; see CONTRIBUTING.md.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
