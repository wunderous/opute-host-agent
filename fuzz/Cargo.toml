[package]
name = "opute-host-agent-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
opute-host-agent = { path = "../crates/host-agent" }

# A separate workspace: the fuzz build never joins the release build.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "http_wire"
path = "fuzz_targets/http_wire.rs"
test = false
doc = false
bench = false

