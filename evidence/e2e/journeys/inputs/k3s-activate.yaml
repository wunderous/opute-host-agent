contractVersion: runtime-recipe.v1
recipeId: com.opute.k3s.managed
recipeVersion: 1.0.0
runtime:
  id: provider-kubernetes
  servingContract: kubernetes.v1
  capabilities: [kubernetes]
activation:
  capability: kubernetes
  servingContract: kubernetes.v1
  inputBindings:
    providerId: providerId
compatibility:
  requiredTools: [get_host_info]
inputs:
  providerId:
    default: com.opute.k3s
    schema: {type: string, const: com.opute.k3s}
  # Provider activation is repeatable. A caller-scoped nonce keeps a fresh
  # activation from replaying a terminal plan that belongs to an older
  # provider generation.
  activationNonce:
    default: default
    schema: {type: string, minLength: 1, maxLength: 128}
plan:
  contractVersion: host-plan.v1
  planId: com.opute.k3s.managed
  generation: 1
  idempotencyKey: com.opute.k3s-${vars.inputs.providerId}-${vars.inputs.activationNonce}
  nodes:
    - id: host
      action:
        tool: get_host_info
