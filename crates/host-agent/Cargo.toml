[package]
name = "opute-host-agent"
version = "0.2.3"
description = "Opute Host Agent (Rust reimplementation; behavior pinned to the Go baseline)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "opute-host-agent"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
hex = "0.4"
tokio = { version = "1", features = ["rt", "net", "signal", "macros", "io-util", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
