[package]
name = "opute-host-agent"
version = "0.2.3"
description = "Opute Host Agent (Rust reimplementation; behavior pinned to the Go baseline)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "opute-host-agent"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
socket2 = "0.6"
base64 = "0.22"
getrandom = "0.2"
hex = "0.4"
nix = { version = "0.29", features = ["net", "signal", "process", "sched", "fs", "user", "hostname"] }
regex = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
tokio = { version = "1", features = ["rt", "net", "signal", "macros", "io-util", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
