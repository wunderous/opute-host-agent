[workspace]
resolver = "2"
members = ["crates/host-agent"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
# `fuzzing` is set by cargo-fuzz for the targets under fuzz/.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = false
strip = true
